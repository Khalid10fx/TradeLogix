name: Build APK and EXE
# Force a fresh run for the final-build verification.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      md5: ${{ steps.app.outputs.md5 }}
    steps:
      - uses: actions/checkout@v4
      - name: Load the final tested app from the repository
        id: app
        shell: bash
        run: |
          set -euo pipefail
          cp app/index.html TRADECYCLE.html
          MD5=$(md5sum TRADECYCLE.html | awk '{print $1}')
          echo "Repository source MD5: $MD5"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: final-html
          path: TRADECYCLE.html

  windows-exe:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-html
          path: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create build-only Electron wrapper
        shell: pwsh
        run: |
          @'
          {
            "name": "tradecycle-desktop-build",
            "version": "1.0.0",
            "private": true,
            "main": "main.cjs",
            "scripts": { "build": "electron-builder --win nsis --publish never" },
            "devDependencies": { "electron": "latest", "electron-builder": "latest" },
            "build": {
              "appId": "com.tradecycle.app",
              "productName": "TradeCycle",
              "files": ["main.cjs", "TRADECYCLE.html"],
              "win": { "target": "nsis", "artifactName": "TradeCycle-Setup.exe" },
              "nsis": { "oneClick": false, "perMachine": false, "allowToChangeInstallationDirectory": true }
            }
          }
          '@ | Set-Content desktop/package.json -Encoding UTF8
          @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");
          function createWindow() {
            const win = new BrowserWindow({ width: 1400, height: 900, webPreferences: { contextIsolation: true } });
            win.loadFile(path.join(__dirname, "TRADECYCLE.html"));
          }
          app.whenReady().then(() => { createWindow(); app.on("activate", () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); }); });
          app.on("window-all-closed", () => { if (process.platform !== "darwin") app.quit(); });
          '@ | Set-Content desktop/main.cjs -Encoding UTF8
      - name: Build installer
        working-directory: desktop
        shell: pwsh
        run: |
          npm install
          npm run build
      - name: Verify installer contains final HTML
        shell: pwsh
        run: |
          $exe = "desktop/dist/TradeCycle-Setup.exe"
          if (!(Test-Path $exe)) { throw "Installer not found" }
          npx --yes @electron/asar extract desktop/dist/win-unpacked/resources/app.asar asar-check
          $a = (Get-FileHash asar-check/TRADECYCLE.html -Algorithm MD5).Hash.ToLower()
          $b = (Get-FileHash desktop/TRADECYCLE.html -Algorithm MD5).Hash.ToLower()
          if ($a -ne $b) { throw "EXE contains different HTML: $a vs $b" }
          Write-Host "PASS: EXE contains final HTML $a"
          Copy-Item $exe TradeCycle-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: TradeCycle-Setup.exe

  android-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-html
          path: source
      - uses: actions/checkout@v4
      - name: Build a fresh Android WebView wrapper
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/tradecycle/app android/app/src/main/assets
          cp app/index.html android/app/src/main/assets/TRADECYCLE.html
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='TradeCycleBuild'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.tradecycle.app'; compileSdk 35
            defaultConfig { applicationId 'com.tradecycle.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="TradeCycle" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:windowActionModeOverlay">true</item></style></resources>
          EOF
          cat > android/app/src/main/java/com/tradecycle/app/MainActivity.java <<'EOF'
          package com.tradecycle.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w=new WebView(this);
              w.setWebViewClient(new WebViewClient());
              WebSettings s=w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              w.loadUrl("file:///android_asset/TRADECYCLE.html");
              setContentView(w);
            }
          }
          EOF
          cd android
          gradle --no-daemon assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > tc.jks
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            PASS=tradecycle123; ALIAS=tradecycle
            keytool -genkeypair -keystore tc.jks -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TradeCycle"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks tc.jks --ks-pass pass:"$PASS" --ks-key-alias "$ALIAS" --out TradeCycle.apk aligned.apk
          $BT/apksigner verify --verbose TradeCycle.apk
          mkdir chk
          unzip -q TradeCycle.apk assets/TRADECYCLE.html -d chk
          test "$(md5sum < chk/assets/TRADECYCLE.html)" = "$(md5sum < app/index.html)"
          echo "PASS: APK contains build source"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TradeCycle.apk

  publish-artifacts:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Publish final build bundle
        run: |
          mkdir -p release/downloads
          cp built/windows-exe/TradeCycle-Setup.exe release/downloads/
          cp built/android-apk/TradeCycle.apk release/downloads/
          (cd release && zip -r ../TradeCycle-BUILT-BINARIES.zip downloads)
      - uses: actions/upload-artifact@v4
        with:
          name: TradeCycle-BUILT-BINARIES
          path: TradeCycle-BUILT-BINARIES.zip
