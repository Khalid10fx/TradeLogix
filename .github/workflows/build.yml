name: Build TradeCycle Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          rm -rf web-content
          mkdir -p web-content
          unzip -q khalid-journal-app.zip -d web-content
          find web-content -type f | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: tradecycle-source
          path: web-content/

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tradecycle-source
          path: web-content
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Create Android project
        shell: bash
        run: |
          set -e
          HTML=$(find web-content -type f \( -iname 'TRADECYCLE.html' -o -iname 'index.html' \) | head -n 1)
          test -n "$HTML"
          mkdir -p android/app/src/main/assets android/app/src/main/java/com/tradecycle/app android/app/src/main/res/values
          cp "$HTML" android/app/src/main/assets/TRADECYCLE.html
          printf '%s\n' "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" "rootProject.name='TradeCycleAndroid'" "include ':app'" > android/settings.gradle
          printf '%s\n' "plugins { id 'com.android.application' version '8.7.3' apply false }" > android/build.gradle
          printf '%s\n' "plugins { id 'com.android.application' }" "android { namespace 'com.tradecycle.app'; compileSdk 35; defaultConfig { applicationId 'com.tradecycle.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }" > android/app/build.gradle
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="TradeCycle" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > android/app/src/main/AndroidManifest.xml
          printf '%s\n' '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#00d4ff</item></style></resources>' > android/app/src/main/res/values/styles.xml
          printf '%s\n' 'package com.tradecycle.app;' 'import android.app.Activity; import android.os.Bundle; import android.webkit.*;' 'public class MainActivity extends Activity { protected void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); w.setWebViewClient(new WebViewClient()); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); w.loadUrl("file:///android_asset/TRADECYCLE.html"); setContentView(w);} }' > android/app/src/main/java/com/tradecycle/app/MainActivity.java
      - name: Build installable APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TradeCycle-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tradecycle-source
          path: web-content
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Electron project
        shell: pwsh
        run: |
          $html = Get-ChildItem -Path web-content -Recurse -File | Where-Object { $_.Name -ieq 'TRADECYCLE.html' -or $_.Name -ieq 'index.html' } | Select-Object -First 1
          if (-not $html) { throw 'No TradeCycle HTML found' }
          New-Item -ItemType Directory -Force -Path TradeCycleDesktop | Out-Null
          Copy-Item $html.FullName TradeCycleDesktop\TRADECYCLE.html -Force
          @("const { app, BrowserWindow } = require('electron');","const path = require('path');","function createWindow(){ const w=new BrowserWindow({width:1440,height:920,minWidth:1100,minHeight:700,backgroundColor:'#07111f',webPreferences:{contextIsolation:true,nodeIntegration:false}}); w.removeMenu(); w.loadFile(path.join(__dirname,'TRADECYCLE.html')); }","app.whenReady().then(()=>{createWindow();app.on('activate',()=>{if(BrowserWindow.getAllWindows().length===0)createWindow();});});","app.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit();});") | Set-Content TradeCycleDesktop\main.cjs -Encoding UTF8
          @('{"name":"tradecycle-desktop","version":"1.0.0","description":"TradeCycle desktop application","main":"main.cjs","private":true,"scripts":{"build:win":"electron-builder --win nsis"},"devDependencies":{"electron":"latest","electron-builder":"latest"},"build":{"appId":"com.tradecycle.app","productName":"TradeCycle","files":["main.cjs","TRADECYCLE.html"],"win":{"target":"nsis","artifactName":"TradeCycle-Setup.exe"},"nsis":{"oneClick":false,"perMachine":false,"allowToChangeInstallationDirectory":true}}}') | Set-Content TradeCycleDesktop\package.json -Encoding UTF8
      - name: Build genuine Windows NSIS installer
        working-directory: TradeCycleDesktop
        run: npm install; npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: TradeCycle-Windows
          path: TradeCycleDesktop\dist\TradeCycle-Setup.exe