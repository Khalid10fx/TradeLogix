name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Web Assets
      run: |
        mkdir -p web-content
        unzip -q *.zip -d web-content
        ls -la web-content

    - name: Summary Check
      run: echo "Web files successfully extracted and ready for packaging."
