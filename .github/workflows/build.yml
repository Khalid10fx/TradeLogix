name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project Source
      run: |
        mkdir -p app-source
        unzip -q *.zip -d app-source

    - name: Build Webview APK
      uses: jaywcjlove/android-action@main
      with:
        path: app-source
        
