name: Build NT_FIXED distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare requested NT_FIXED structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NT_FIXED
          mkdir -p NT_FIXED/assets NT_FIXED/desktop NT_FIXED/downloads
          cp index.html manifest.webmanifest netlify.toml privacy.html README.md sw.js terms.html NT_FIXED/
          cp Web/assets/icon.svg NT_FIXED/assets/icon.svg
          cp Web/index.html NT_FIXED/desktop/TradeCycle-Web.html
          cp -r Web/assets NT_FIXED/desktop/assets
          cp Web/privacy.html NT_FIXED/desktop/privacy.html
          cp Web/terms.html NT_FIXED/desktop/terms.html
          cp Web/sw.js NT_FIXED/desktop/sw.js

      - name: Download verified platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p NT_FIXED/downloads
          gh release download v1.1.1 --repo "${{ github.repository }}" --pattern "TradeCycle.apk" --dir NT_FIXED/downloads --clobber
          gh release download v1.1.1 --repo "${{ github.repository }}" --pattern "TradeCycle-Setup.exe" --dir NT_FIXED/downloads --clobber
          test -s NT_FIXED/downloads/TradeCycle.apk
          test -s NT_FIXED/downloads/TradeCycle-Setup.exe
          echo "APK:"
          sha256sum NT_FIXED/downloads/TradeCycle.apk
          echo "Windows:"
          sha256sum NT_FIXED/downloads/TradeCycle-Setup.exe

      - name: Verify HTML JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('NT_FIXED/desktop/TradeCycle-Web.html','utf8');
          const scripts=[...html.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          if(!scripts.length) throw new Error('No JavaScript blocks found');
          scripts.forEach((src,i)=>{ try { new Function(src); } catch(e) { console.error('SCRIPT '+(i+1)+' FAILED'); console.error(e.message); process.exit(1); } });
          if(html.includes('\\\\n const ')) throw new Error('Literal \\n JavaScript corruption detected');
          if(!html.includes('buymeacoffee.com/yayazheyv')) throw new Error('Buy Me a Coffee link missing');
          console.log('Validated '+scripts.length+' JavaScript blocks');
          NODE

      - name: Verify package structure and links
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest netlify.toml privacy.html README.md sw.js terms.html assets/icon.svg desktop/TradeCycle-Web.html downloads/TradeCycle.apk downloads/TradeCycle-Setup.exe; do
            test -f "NT_FIXED/$f" || { echo "Missing: $f"; exit 1; }
          done
          grep -q 'desktop/TradeCycle-Web.html' NT_FIXED/index.html
          grep -q 'downloads/TradeCycle.apk' NT_FIXED/index.html
          grep -q 'downloads/TradeCycle-Setup.exe' NT_FIXED/index.html
          unzip -t NT_FIXED/downloads/TradeCycle.apk >/dev/null
          file NT_FIXED/downloads/TradeCycle-Setup.exe | grep -qi 'PE32\|MS-DOS'
          echo "Structure verified:"
          find NT_FIXED -maxdepth 2 -type f -print | sort

      - name: Create ZIP and verify it
        shell: bash
        run: |
          set -euo pipefail
          rm -f TradeCycle_NT_FIXED.zip
          zip -qr TradeCycle_NT_FIXED.zip NT_FIXED
          unzip -t TradeCycle_NT_FIXED.zip >/dev/null
          echo "ZIP SHA256:"
          sha256sum TradeCycle_NT_FIXED.zip
          echo "ZIP size:"
          ls -lh TradeCycle_NT_FIXED.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TradeCycle_NT_FIXED
          path: TradeCycle_NT_FIXED.zip
          retention-days: 30

      - name: Publish direct download release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nt-fixed-latest
          name: TradeCycle NT_FIXED
          target_commitish: ${{ github.sha }}
          body: "Verified NT_FIXED distribution. The ZIP contains the requested root index.html launcher and Android/Windows/Web builds."
          files: TradeCycle_NT_FIXED.zip
